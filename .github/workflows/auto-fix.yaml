name: Code Auto-Fix
on:
  issues:
    types: [labeled]

jobs:
  claude-fix:
    # Only run when the "auto-fix" label is added to an issue
    if: github.event.label.name == 'auto-fix'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Essential for Claude to see project history

      - name: Run Claude Code Fix
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # The prompt defines the autonomous behavior
          prompt: |
            I need you to fix a bug or implement a feature based on this GitHub issue.
            
            Issue Title: ${{ github.event.issue.title }}
            Issue Body: ${{ github.event.issue.body }}
            
            Instructions:
            1. Create a new feature branch named 'fix/issue-${{ github.event.issue.number }}'.
            2. Review euchre.html and the guidelines in CLAUDE.md.
            3. Implement the fix entirely within the single-file architecture.
            4. If the code is correct, push the branch to origin.
          claude_args: "--max-turns 8"

      - name: Auto-Merge to Main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Create a PR for the new branch
          BRANCH_NAME="fix/issue-${{ github.event.issue.number }}"
          pr_url=$(gh pr create \
            --title "Auto-fix: ${{ github.event.issue.title }}" \
            --body "Automated fix generated by Claude Code for issue #${{ github.event.issue.number }}." \
            --base main \
            --head $BRANCH_NAME)
          
          # Automatically merge the PR into main
          gh pr merge $pr_url --auto --merge --delete-branch
          
          # Close the original issue
          gh issue close ${{ github.event.issue.number }} --comment "Fixed automatically by Claude Code."
